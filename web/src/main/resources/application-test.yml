spring:
  datasource:
    url: jdbc:h2:mem:vulntrack;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never
  flyway:
    enabled: false

vulntrack:
  jwt:
    secret: test-jwt-secret-key-for-vulntrack-tests-only
  escalation:
    enabled: false
