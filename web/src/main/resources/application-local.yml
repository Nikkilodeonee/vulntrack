spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vulntrack}
    username: ${DB_USERNAME:vulntrack}
    password: ${DB_PASSWORD:vulntrack}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

# Open only for local demo (Docker Compose / local profile). Disabled by default.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
